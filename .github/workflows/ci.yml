name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/**"
      - "atlas/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/**"
      - "atlas/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.node-version == 20 && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - run: npm ci
      - run: npm run build
      - id: tests
        run: npm test
        # On the coverage leg every Node process the tests start leaves raw V8
        # coverage outside the tree, and the test runner also writes JUnit to
        # junit.xml where it runs; elsewhere both variables are empty, which
        # Node reads as unset.
        env:
          NODE_OPTIONS: ${{ env.COVERAGE_LEG == 'true' && '--test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml' || '' }}
          NODE_V8_COVERAGE: ${{ env.COVERAGE_LEG == 'true' && format('{0}/v8-coverage', runner.temp) || '' }}
      # One lcov report from the raw coverage every Node process of the
      # tests left. The exact version keeps npx from fetching whichever c8
      # is newest on the day.
      - name: Coverage report for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        run: npx --yes c8@12.0.0 report --temp-directory "$RUNNER_TEMP/v8-coverage" --reporter=lcov --reporter=text-summary --report-dir coverage/c8
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/c8/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: |
            packages/cli/junit.xml
            packages/kernel/junit.xml
            packages/memories/junit.xml
            packages/rules/junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - run: npm audit --audit-level=moderate

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result != 'cancelled' && needs.build-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage/c8
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: packages
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('coverage/c8/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/c8/lcov.info
      - name: Upload test results to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('packages/cli/junit.xml', 'packages/kernel/junit.xml', 'packages/memories/junit.xml', 'packages/rules/junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./packages/cli/junit.xml,./packages/kernel/junit.xml,./packages/memories/junit.xml,./packages/rules/junit.xml

  # Deploy the handbook + landing to GitHub Pages — only on a push to main,
  # only after build-and-test passes. Folded into this workflow (rather than a
  # separate pages.yml) to honor the github-actions.md max-2-workflows rule
  # (ci.yml + release.yml).
  deploy-pages:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
